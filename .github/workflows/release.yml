name: Create Release

on:
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    
    - name: Generate changelog
      id: changelog
      run: |
        # Get the latest two tags
        CURRENT_TAG=${GITHUB_REF#refs/tags/}
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${CURRENT_TAG}^ 2>/dev/null || echo "")
        
        echo "Current tag: $CURRENT_TAG"
        echo "Previous tag: $PREVIOUS_TAG"
        
        # Generate changelog
        if [ -z "$PREVIOUS_TAG" ]; then
          CHANGELOG="Initial release of goobits-cli"
        else
          CHANGELOG=$(git log --pretty=format:"- %s" ${PREVIOUS_TAG}..${CURRENT_TAG})
        fi
        
        # Save changelog to file for multi-line handling
        cat > changelog.txt << EOF
        ## Changes in $CURRENT_TAG
        
        $CHANGELOG
        
        ## Installation
        
        \`\`\`bash
        pip install goobits-cli==${CURRENT_TAG#v}
        \`\`\`
        
        ## Quick Start
        
        \`\`\`bash
        goobits init
        goobits build
        \`\`\`
        EOF
        
        echo "changelog-file=changelog.txt" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        body_path: changelog.txt
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        generate_release_notes: true
